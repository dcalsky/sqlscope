[workspace]
resolver = "2"
members = ["crates/sqlscope", "crates/sqlscope-ffi"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/dcalsky/sqlscope"
homepage = "https://github.com/dcalsky/sqlscope"
authors = ["dcalsky <dcalsky@gmail.com>"]

[workspace.dependencies]
polyglot-sql = { version = "=0.13.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
lto = true
codegen-units = 1

# Release build of the FFI libraries. Panics must unwind so the C ABI can
# turn them into errors instead of aborting the host process.
[profile.ffi]
inherits = "release"
panic = "unwind"
strip = "debuginfo"
