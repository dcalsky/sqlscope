[workspace]
resolver = "2"
members = ["crates/sqlscope", "crates/sqlscope-wasm", "python"]
default-members = ["crates/sqlscope", "crates/sqlscope-wasm", "python"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/dcalsky/sqlscope"
homepage = "https://github.com/dcalsky/sqlscope"
authors = ["dcalsky <dcalsky@gmail.com>"]

[workspace.dependencies]
polyglot-sql = { version = "=0.13.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
lto = true
codegen-units = 1

# Size-optimized build of the WebAssembly module embedded in the Go SDK.
[profile.wasm]
inherits = "release"
opt-level = "s"
strip = true
panic = "abort"
