[package]
name = "sqlscope-wasm"
description = "WebAssembly module (wasm-bindgen) behind the sqlscope TypeScript SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
sqlscope-json = { path = "../sqlscope-json", default-features = false }
serde_json.workspace = true
wasm-bindgen = "=0.2.129"
