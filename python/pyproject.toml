[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sqlscope-rs"
description = "Scope-aware SQL analysis and rewriting: row filters, CTE injection, table rewrites, column lineage."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dynamic = ["version"]
keywords = ["sql", "lineage", "row-level-security", "parser"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/dcalsky/sqlscope"

[tool.hatch.version]
path = "src/sqlscope/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlscope"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
