[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "sqlscope-rs"
description = "Scope-aware SQL analysis and rewriting: row filters, CTE injection, table rewrites, column lineage."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dynamic = ["version"]
keywords = ["sql", "lineage", "row-level-security", "parser"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/dcalsky/sqlscope"

[tool.maturin]
python-source = "python"
module-name = "sqlscope._native"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
