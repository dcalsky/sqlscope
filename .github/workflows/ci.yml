name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude sqlscope-python
      - name: Test
        run: cargo test --workspace --exclude sqlscope-python
      - name: Docs
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps -p sqlscope

  msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p sqlscope -p sqlscope-wasm

  wasm:
    name: WebAssembly engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Build
        env:
          RUSTFLAGS: ""
        run: |
          cp go/internal/wasm/sqlscope.wasm.gz /tmp/committed.wasm.gz
          scripts/build-wasm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sqlscope-wasm
          path: go/internal/wasm/sqlscope.wasm.gz
      - name: Committed engine matches the sources
        run: |
          if ! cmp -s <(gunzip -c /tmp/committed.wasm.gz) <(gunzip -c go/internal/wasm/sqlscope.wasm.gz); then
            echo "::error::go/internal/wasm/sqlscope.wasm.gz is stale; run scripts/build-wasm.sh and commit the result"
            exit 1
          fi

  go:
    name: Go (${{ matrix.os }})
    needs: wasm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sqlscope-wasm
          path: go/internal/wasm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go test -race -count=1 ./...

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install
        shell: bash
        env:
          RUSTFLAGS: ""
        run: |
          python -m pip install --upgrade pip maturin pytest mypy
          maturin build --release --out dist
          python -m pip install --no-index --find-links dist sqlscope
      - name: Test
        run: python -m pytest -q
      - name: Type check
        run: python -m mypy --strict python/sqlscope
