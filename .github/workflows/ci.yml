name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Feature gates
        if: runner.os == 'Linux'
        run: make test-feature-gates
      - name: Docs
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps -p sqlscope
      # The SDK jobs below test against this build of the FFI library.
      - name: Build FFI library
        shell: bash
        run: |
          cargo build -p sqlscope-ffi
          mkdir ffi
          cp target/debug/libsqlscope_ffi.{so,dylib} target/debug/sqlscope_ffi.dll ffi/ 2>/dev/null || true
          ls ffi
      - name: C smoke test
        if: runner.os != 'Windows'
        run: |
          cc -I crates/sqlscope-ffi/include crates/sqlscope-ffi/tests/c/smoke.c -L ffi -lsqlscope_ffi -o smoke
          LD_LIBRARY_PATH=ffi DYLD_LIBRARY_PATH=ffi ./smoke
      - uses: actions/upload-artifact@v4
        with:
          name: ci-ffi-${{ matrix.os }}
          path: ffi

  msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p sqlscope -p sqlscope-ffi

  go:
    name: Go (${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: go
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-ffi-${{ matrix.os }}
          path: ffi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Test
        run: |
          export SQLSCOPE_LIBRARY_PATH="$(ls "$GITHUB_WORKSPACE"/ffi/*sqlscope_ffi.*)"
          go test -race -count=1 ./...
          CGO_ENABLED=0 go test -count=1 ./...

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: python
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-ffi-${{ matrix.os }}
          path: ffi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip . pytest mypy
      - name: Test
        run: |
          export SQLSCOPE_LIBRARY_PATH="$(ls "$GITHUB_WORKSPACE"/ffi/*sqlscope_ffi.*)"
          python -m pytest -q
      - name: Type check
        run: python -m mypy --strict src/sqlscope

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Read wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"/\1/p;}' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Build
        run: make build-typescript
      - name: Type check
        working-directory: typescript
        run: npm run typecheck
      - name: Test
        working-directory: typescript
        run: npm test
