name: Release

# Pushing a tag vX.Y.Z (matching the workspace version) runs the full CI
# suite, then:
#   - builds the FFI libraries (shared + static library and C header) for
#     every platform, smoke-tests each archive from C, Go and Python on its
#     native runner, and attaches the archives and checksums to a GitHub
#     release;
#   - publishes the pure-Python SDK to PyPI as `sqlscope-rs` (trusted
#     publishing, `pypi` environment; it contains no native code);
#   - publishes the TypeScript SDK to npm as `sqlscope-rs` (secret
#     NPM_ACCESS_TOKEN, with provenance); it bundles sqlscope compiled to
#     WebAssembly;
#   - tags the Go module as go/vX.Y.Z;
#   - publishes the crate to crates.io when vars.PUBLISH_CRATES is 'true'.
# The Python and Go SDKs load the FFI libraries at runtime and never bundle
# or download them. Running it manually (workflow_dispatch) builds everything
# without publishing, except that the publish-npm input publishes the npm
# package of the workspace version when that version is not on npm yet.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish-npm:
        description: Publish the npm package of the workspace version
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read workspace version
        id: version
        run: |
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          python_version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' python/src/sqlscope/__init__.py)"
          npm_version="$(jq -r .version typescript/package.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$python_version" != "$version" ]]; then
            echo "::error::python/src/sqlscope/__init__.py version $python_version does not match workspace version $version"
            exit 1
          fi
          if [[ "$npm_version" != "$version" ]]; then
            echo "::error::typescript/package.json version $npm_version does not match workspace version $version"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  ffi:
    name: FFI (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run on the oldest supported runners to keep the
          # glibc requirement low (2.35).
          - { platform: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { platform: linux-aarch64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { platform: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin }
          - { platform: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin }
          - { platform: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      DIST: sqlscope-ffi-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        env:
          RUSTFLAGS: --print=native-static-libs
          CARGO_TERM_COLOR: never
        run: |
          cargo build -p sqlscope-ffi --profile ffi --locked --target ${{ matrix.target }} 2>&1 | tee build.log
          sed 's/\x1b\[[0-9;]*m//g' build.log | sed -n 's/.*note: native-static-libs: //p' | tail -1 | tr -d '\r' > native-static-libs.txt
          cat native-static-libs.txt
          test -s native-static-libs.txt
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          out="target/${{ matrix.target }}/ffi"
          mkdir "$DIST"
          cp crates/sqlscope-ffi/include/sqlscope.h LICENSE "$DIST/"
          case "${{ runner.os }}" in
            Linux) cp "$out/libsqlscope_ffi.so" "$out/libsqlscope_ffi.a" "$DIST/" ;;
            macOS) cp "$out/libsqlscope_ffi.dylib" "$out/libsqlscope_ffi.a" "$DIST/" ;;
            Windows) cp "$out/sqlscope_ffi.dll" "$out/sqlscope_ffi.dll.lib" "$out/sqlscope_ffi.lib" "$DIST/" ;;
          esac
          cat > "$DIST/README.md" <<README
          # sqlscope FFI $VERSION (${{ matrix.platform }})

          C ABI of [sqlscope](https://github.com/dcalsky/sqlscope): see \`sqlscope.h\`.
          The Python and Go SDKs load the shared library; pass its path to
          \`sqlscope.load()\` / \`sqlscope.Load()\` or set \`SQLSCOPE_LIBRARY_PATH\`.

          Linking the static library also needs these system libraries:

              $(cat native-static-libs.txt)
          README
          ls -l "$DIST"
      # Every runner is native to its target, so each archive is exercised
      # from C, Go and Python before it can be published.
      - name: Test from C
        if: runner.os != 'Windows'
        run: |
          cc -I "$DIST" crates/sqlscope-ffi/tests/c/smoke.c "$DIST/libsqlscope_ffi.a" $(cat native-static-libs.txt) -o smoke-static
          ./smoke-static
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Test from Go
        working-directory: go
        run: SQLSCOPE_LIBRARY_PATH="$(ls "$GITHUB_WORKSPACE/$DIST"/*sqlscope_ffi.{so,dylib,dll} 2>/dev/null)" CGO_ENABLED=0 go test -count=1 ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test from Python
        working-directory: python
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python -m pip install pytest
          export SQLSCOPE_LIBRARY_PATH="$(ls "$GITHUB_WORKSPACE/$DIST"/*sqlscope_ffi.{so,dylib,dll} 2>/dev/null)"
          python -m pytest -q
          PYTHONPATH=src python -c 'import os, sqlscope; assert sqlscope.library_version() == os.environ["VERSION"], sqlscope.library_version()'
      - name: Archive
        run: |
          if [[ "${{ runner.os }}" == Windows ]]; then
            7z a -tzip -mx=9 "$DIST.zip" "$DIST"
          else
            tar -cf - "$DIST" | gzip -9 > "$DIST.tar.gz"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ffi-${{ matrix.platform }}
          path: ${{ env.DIST }}.*

  python:
    name: Python package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: python
        run: |
          python -m pip install build
          python -m build --outdir dist
      - name: Check artifacts
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls python/dist
          for f in python/dist/*; do
            case "$(basename "$f")" in
              sqlscope_rs-"$VERSION"-py3-none-any.whl | sqlscope_rs-"$VERSION".tar.gz) ;;
              *) echo "::error::unexpected artifact $f"; exit 1 ;;
            esac
          done
          # Pure Python: no shared library may be packaged.
          if unzip -l python/dist/*.whl | grep -E '\.(so|dylib|dll|pyd)$'; then
            echo "::error::wheel contains a native library"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist

  npm-package:
    name: npm package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Read wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"/\1/p;}' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - name: Install wasm-opt
        run: |
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz | tar -xz
          echo "$PWD/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build
        run: make build-typescript
      - name: Test
        working-directory: typescript
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm run typecheck
          npm test
          npm pack --pack-destination dist
          test -f "dist/sqlscope-rs-$VERSION.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: typescript/dist/*.tgz

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, ffi, python]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sqlscope-rs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish-npm
    needs: [version, ci, ffi, npm-package]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/sqlscope-rs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if npm view "sqlscope-rs@$VERSION" version >/dev/null 2>&1; then
            echo "sqlscope-rs@$VERSION is already published"
            exit 0
          fi
          npm publish "sqlscope-rs-$VERSION.tgz" --access public --provenance

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, ffi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ffi-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.sha256
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  go-tag:
    name: Tag Go module
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, ffi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create go/${{ github.ref_name }}
        run: |
          tag="go/$GITHUB_REF_NAME"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

  crates-io:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_CRATES == 'true'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish -p sqlscope
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
